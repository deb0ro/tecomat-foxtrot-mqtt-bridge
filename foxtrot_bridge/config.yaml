name: "Tecomat Foxtrot Bridge"
version: "1.5.0"
slug: "foxtrot_bridge"
description: "Bridge between Tecomat Foxtrot PLC and Home Assistant using MQTT"
url: "https://github.com/deb0ro/tecomat-foxtrot-mqtt-bridge"
init: false
arch:
  - armhf
  - armv7
  - aarch64
  - amd64
  - i386
startup: application
boot: auto
uart: false
map:
  - config:rw
options:
  plc_host: "IPADDRESS"
  plc_port: 5010
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: "MQTTUSER"
  mqtt_password: "MQTTPWD"
  mqtt_topic: "plc/foxtrot"
  refresh_interval: 10
  write_enabled: true
  variables:
    - name: "AC_EON.L123_KW"
      type: "REAL"
      unitOfMeasurement: 'kW'
      calculateEnergy: true
    - name: "AC_FVE.L123_KW"
      type: "REAL"
      unitOfMeasurement: 'kW'
      calculateEnergy: true
  web_variables: []
schema:
  plc_host: str
  plc_port: port
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str
  mqtt_password: str
  mqtt_topic: str
  refresh_interval: int
  resync_interval: int?
  write_enabled: bool?
  variables:
    - name: str
      type: str
      unitOfMeasurement: str?
      calculateEnergy: bool?
      entity: list(sensor|binary_sensor|switch|number)?
      min: float?
      max: float?
      step: float?
      delta: float?
      deviceClass: str?
      stateClass: list(measurement|total|total_increasing)?
  web_port: port?
  web_user: str?
  web_password: password?
  web_variables:
    - name: str
      page: str
      input: match(^__T[0-9A-Fa-f]{8}$)
      type: str
      unitOfMeasurement: str?
      entity: list(sensor|binary_sensor)?
      deviceClass: str?
      stateClass: list(measurement|total|total_increasing)?
